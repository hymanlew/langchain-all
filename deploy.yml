#这个 YAML 文件是 GitHub Actions 的配置文件，用于实现持续集成和持续部署（CI/CD）。GitHub Actions 是 GitHub 官方的 CI/CD 平台，内置于 GitHub 仓库中。
#- 它定义了一个在代码推送到 main 分支时自动运行的工作流，是 AI 代理的自动化部署流水线。
#- 文件名通常为 .github/workflows/deploy.yml（或类似名称），存放在 GitHub 仓库的指定路径中。
#
#工作流包括测试和部署两个主要步骤，下面逐部分解释这个配置文件：
#- name: 工作流的名称，这里是“Deploy AI Agent”。
#- on: 指定触发工作流的事件。这里是在推送到 main 分支时触发。
#- jobs: 定义工作流中的任务。这里有两个任务 test 和 deploy，分别用于测试和部署。
#    - runs-on: 指定运行环境，这里是ubuntu-latest。
#    - steps: 定义任务中的步骤。
#
#第一步：使用actions/checkout@v2动作来检出代码。
#第二步：使用actions/setup-python@v2动作设置Python环境，指定版本为3.9。
#第三步：安装依赖，通过运行pip install -r requirements.txt命令。
#第四步：运行测试，使用pytest运行tests/目录下的测试。如果没有测试，可以删除运行测试的步骤。
#第五步：部署到AWS，这里是一个示例，使用了AWS CLI命令进行部署。其中，AWS的访问密钥通过GitHub Secrets传递。
#
#如何使用和配置 Secrets：
#- GitHub 仓库 → Settings → Secrets and variables → Actions -> AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY
#
#总之，这个配置文件允许你在每次推送到 main 分支时自动运行测试并部署应用。当开发者将代码推送到 GitHub 仓库的 main 分支时，
#GitHub 会自动检测到 .github/workflows 目录下的 YAML 文件，并开始执行其中定义的工作流。不是 Jenkins。

name: Deploy AI Agent
on:
  push:
    branches:
      - main # 只有推送到 main 分支时才触发
  pull_request:
    branches: [main]

jobs:
  test-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.9"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest tests/ --verbose

  deploy-demo:
    runs-on: ubuntu-latest
    needs: test  # 依赖测试任务
    if: github.ref == 'refs/heads/main'  # 仅 main 分支部署
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          # 你的部署脚本
          echo "Deploying..."